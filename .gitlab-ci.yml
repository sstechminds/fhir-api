image: gradle:alpine

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

stages:
  - build
  - git-copy

build:
  stage: build
  script:
    - gradle spotlessApply
    - gradle clean build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/libs
      - build/reports/tests/test/
      - build/test-results/test/
      - build/reports/codecoverage/

git-copy:
  image: centos:8
  stage: git-copy
  when: always
  only:
    refs:
      - tags
      - master
  before_script:
    - echo "In git-copy stage..."
    - yum update -y
    - yum install git -y
    - git config --global user.email "fswrite@gmail.com"
    - git config --global user.name "FlowSIGMA ServiceAccount"
  script:
    - pwd
    - git clone https://fswrite:Write_acct@bitbucket.org/flowsigma/docker_ewocs.git
    - cp build/libs/ewocsfhirapi*.jar docker_ewocs/ewocsfhirapi.jar
    - curl -fsSL https://get.docker.com/ | sh
    - systemctl enable docker
    - systemctl start docker
    - docker info