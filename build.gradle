buildscript {
	ext {
		springBootVersion = '2.3.4.RELEASE'
	}
	repositories {
		mavenCentral()
		jcenter()
		maven { url "https://repo.spring.io/snapshot" }
		maven { url "https://repo.spring.io/milestone" }
		maven { url "https://plugins.gradle.org/m2" }
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:2.3.4.RELEASE")
		classpath("io.spring.gradle:dependency-management-plugin:1.0.10.RELEASE")
	}
}

plugins {
	id 'org.springframework.boot' version '2.3.4.RELEASE'
	id 'io.spring.dependency-management' version '1.0.10.RELEASE'
	id 'java'
	id 'groovy'
	id 'com.diffplug.gradle.spotless' version '3.27.1'
}

group = 'com.flowsigma.ewocs'
version = '0.0.1-SNAPSHOT'

sourceCompatibility = '1.8'

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'groovy'
//apply plugin: 'application'
apply plugin: 'org.springframework.boot'
apply plugin: 'com.diffplug.gradle.spotless'

configurations {
	providedRuntime
	all*.exclude group: 'org.sl4j', module: 'sl4j-log4j12'
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	jcenter()
	maven { url "http://www.dcm4che.org/maven2" }
	maven { url "https://repo.spring.io/snapshot" }
	maven { url "https://repo.spring.io/milestone" }
	maven { url "https://maven.alfresco.com/nexus/content/groups/public/" }
	maven { url "https://oss.sonatype.org/content/groups/public" }
}

dependencies {

	implementation 'ca.uhn.hapi.fhir:hapi-fhir-base:5.1.0'
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-client:5.1.0'
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-client-okhttp:5.1.0'
	implementation 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:5.1.0'

	implementation 'org.json:json:20200518'

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

//	implementation 'org.springframework.boot:spring-boot-starter-security'

	implementation "org.springframework.boot:spring-boot-devtools:2.2.7.RELEASE"
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	compile 'org.apache.httpcomponents:httpcore:4.4.13'
	compile 'org.apache.httpcomponents:httpclient:4.5.13'
	compile 'commons-io:commons-io:2.8.0'
	compile 'org.apache.commons:commons-lang3:3.11'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	compile 'com.google.code.gson:gson:2.8.6'

//	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//	runtimeOnly 'org.postgresql:postgresql'

	// DCM4CHE
	implementation "dcm4che:dcm4che-core:2.0.29.v20180102_1551"
	implementation "dcm4che:dcm4che-net:2.0.29.v20180102_1551"
	implementation "dcm4che:dcm4che-image:2.0.29.v20180102_1551"
	implementation "dcm4che:dcm4che-filecache:2.0.29.v20180102_1551"

	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}

	//junit 5
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'

	//spock test framework
	testRuntimeOnly "org.junit.vintage:junit-vintage-engine:5.3.0"

	implementation 'org.codehaus.groovy:groovy:3.0.5'
	testImplementation('org.spockframework:spock-core:2.0-M3-groovy-3.0')
	testImplementation('org.spockframework:spock-spring:2.0-M3-groovy-3.0')

	testRuntime 'cglib:cglib-nodep:3.3.0'

//	testImplementation 'org.springframework.security:spring-security-test'
}

test {
	useJUnitPlatform()
}

bootJar {
	mainClassName = 'com.flowsigma.ewocs.fhir.EwocsFhirApiApplication'
}